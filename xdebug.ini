[xdebug]
; Default: Xdebug ist geladen, aber vollständig inaktiv – keine Verbindungsversuche, keine Warnungen.
;
; Aktivierung per Umgebungsvariable XDEBUG_MODE (überschreibt diesen Wert):
;   Debuggen (Entwicklung):   XDEBUG_MODE=debug
;   Coverage (CI-Pipeline):   XDEBUG_MODE=coverage
;   Kombiniert:               XDEBUG_MODE=debug,coverage
;
; Beispiel docker-compose (Service php):
;   environment:
;     XDEBUG_MODE: debug
;
; Beispiel Einmalaufruf:
;   XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-text
xdebug.mode=off
xdebug.client_host=host.docker.internal
xdebug.start_with_request=yes
